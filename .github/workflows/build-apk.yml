name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

env:
  ANDROID_HOME: /home/runner/android-sdk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and set up Android SDK command line tools
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK platform and build-tools
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        run: python3 build.py

      - name: Re-sign with fixed keystore (stable signature across rebuilds)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          printf '%s' '' | base64 -d > /tmp/fixed.keystore
          for apk in dist/*.apk; do
            aligned="${apk%.apk}-aligned.apk"
            "$BT/zipalign" -f 4 "$apk" "$aligned"
            "$BT/apksigner" sign --ks /tmp/fixed.keystore --ks-key-alias qpollfix \
                --ks-pass pass:qpollfix2026 --key-pass pass:qpollfix2026 \
                --out "$apk" "$aligned"
            rm -f "$aligned"
          done
          cd dist
          for apk in *.apk; do sha256sum "$apk" | tee "$apk.sha256"; done
          "$BT/apksigner" verify --verbose *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QPollLab-apk
          path: dist/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qpolllab-v2.10-test1
          name: QPollLab 2.10-test1
          body: |
            QPollLab（Fork 自动构建）。本机构建参数：minSdk 23 / targetSdk 34，
            手动 A0/A1 选择、Root 与 Shizuku 后端、D1/D3/D4/DE 协议。
          files: |
            dist/QPollLab-2.10-test1.apk
            dist/QPollLab-2.10-test1.apk.sha256
          fail_on_unmatched_files: true
